<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Übeplan Saxophon</title>

<!-- Installation: manifest.json liefert Name, Icons und Vollbildstart. iOS wertet
     fuer "Zum Home-Bildschirm" zusaetzlich die apple-Angaben und den
     apple-touch-icon aus, deshalb stehen beide Wege nebeneinander. -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Üben">
<meta name="theme-color" content="#0C2226">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">

<!-- Nur die beiden Schnitte vorladen, die beim ersten Bild sichtbar sind:
     Countdown-Ziffern und Grundschrift. -->
<link rel="preload" href="fonts/instrument-serif-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-400-latin.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/tools.css">
<link rel="stylesheet" href="css/responsive.css">
</head>

<body>
<div id="app">

  <div class="topbar">
    <span id="today-label"></span>
    <span id="topbar-slot"></span>
  </div>
  <div class="focus-line" id="focus-line" hidden></div>

  <div id="toolbar" role="tablist" aria-label="Werkzeuge"></div>

  <main>
    <section id="tool"></section>
  </main>

  <div id="running" hidden></div>

  <nav aria-label="Bereiche">
    <div class="inner"></div>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<noscript>
  <p style="padding:20px">Diese App braucht JavaScript. Ohne läuft weder Timer noch Ton.</p>
</noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
